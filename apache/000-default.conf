<VirtualHost *:80>
    DocumentRoot /var/www/public
    DirectoryIndex index.php

    <Directory /var/www>
        AllowOverride All
        Order allow,deny
        Allow from all
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined

    # Make sure the .htaccess file for Laravel can handle URL rewriting
    RewriteEngine On
    RewriteRule ^(.*)$ index.php [L]
</VirtualHost>
